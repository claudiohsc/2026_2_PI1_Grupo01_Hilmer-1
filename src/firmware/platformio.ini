[platformio]
default_envs = esp32c3

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson@7.4.2

# Placa ESP32-C3 Super Mini (esquemático Rev 2.0). A plataforma não tem definição própria dela; o
# chip e a flash (ESP32-C3, 4 MB) são os mesmos da esp32-c3-devkitm-1.
# O `Serial` precisa sair pela USB nativa (GPIO18/19), porque GPIO20/21, a UART0, são as entradas
# IN3/IN4 do driver dos motores (`Pinos.h`). Sem estas duas opções, o log iria para a UART0.
[env:esp32c3]
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200

[env:native]
platform = native
lib_ignore = drivers_esp32
lib_ldf_mode = deep+
test_framework = unity

[env:native_cobertura]
extends = env:native
build_flags =
  ${env.build_flags}
  -O0
  --coverage
extra_scripts = post:cobertura_link.py
